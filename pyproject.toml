[project]
name = "nanovlm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.29.1",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "huggingface-hub>=1.30.0",
    "kernels>=0.16.1",
    "lmms-eval==0.7.3",
    "loguru>=0.7.0",
    "matplotlib>=3.10.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "wandb>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
override-dependencies = ["wandb>=0.30.0"]
